<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Your Shopping Cart</title>
</head>
<body>
    <div layout:fragment="content" class="container body-content">
        <h2>Shopping Cart</h2>
        <div th:if="${#lists.isEmpty(items)}">
            <p>Your cart is empty. <a th:href="@{/products}">Go back to shopping</a>.</p>
        </div>
        <div th:if="${!#lists.isEmpty(items)}">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Amount</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td><img th:src="${item.image}" height="50" width="70" alt="product"></td>
                        <td th:text="${item.name}"></td>
                        <td th:text="${item.price}"></td>
                        <td>
                            <form th:action="@{/cart/update}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${item.productId}">
                                <input type="number" name="quantity" th:value="${item.quantity}" min="1" onchange="this.form.submit()" style="width: 60px;">
                            </form>
                        </td>
                        <td th:text="${item.price * item.quantity}"></td>
                        <td>
                            <a th:href="@{/cart/remove/{id}(id=${item.productId})}" class="btn btn-danger btn-sm">Remove</a>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="4" style="text-align:right">Total Amount:</th>
                        <th th:text="${total}"></th>
                        <th></th>
                    </tr>
                </tfoot>
            </table>
            <div class="row">
                <div class="col-md-4">
                    <a th:href="@{/products}" class="btn btn-primary">Continue Shopping</a>
                </div>
                <div class="col-md-4 text-center">
                    <a th:href="@{/checkout}" class="btn btn-success">Checkout</a>
                </div>
                <div class="col-md-4 text-right">
                    <a th:href="@{/cart/clear}" class="btn btn-warning">Clear Cart</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
