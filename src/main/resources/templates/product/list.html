<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div layout:fragment="content" class="container body-content">
        <div class="row my-3">
            <div class="col-md-6">
                <a th:href="@{/products/add}" class="btn btn-primary">Create New Product</a>
            </div>
            <div class="col-md-6">
                <form th:action="@{/products}" method="get" class="form-inline float-right">
                    <div class="input-group">
                        <select name="categoryId" class="form-control mr-2">
                            <option value="0">All Categories</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.id}" 
                                    th:text="${cat.name}"
                                    th:selected="${cat.id == categoryId}"></option>
                        </select>
                        <input type="text" name="keyword" class="form-control" placeholder="Search by name..." th:value="${keyword}">
                        <div class="input-group-append">
                            <button class="btn btn-outline-secondary" type="submit">Search</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">
                        <a th:href="@{/products(page=${currentPage}, keyword=${keyword}, categoryId=${categoryId}, sortField='id', sortDir=${reverseSortDir})}">#</a>
                    </th>
                    <th scope="col">
                        <a th:href="@{/products(page=${currentPage}, keyword=${keyword}, categoryId=${categoryId}, sortField='name', sortDir=${reverseSortDir})}">Name</a>
                    </th>
                    <th scope="col">Image</th>
                    <th scope="col">
                        <a th:href="@{/products(page=${currentPage}, keyword=${keyword}, categoryId=${categoryId}, sortField='price', sortDir=${reverseSortDir})}">Price</a>
                    </th>
                    <th scope="col">Category Name</th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <th scope="row" th:text="${product.id}"></th>
                    <td th:text="${product.name}"></td>
                    <td>
                        <img height="120" width="150" th:src="${product.image}" alt="Product Image">
                    </td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.category != null} ? ${product.category.name} : ''"></td>
                    <td>
                        <a th:href="@{/cart/add/{id}(id=${product.id})}" class="btn btn-success">Add to Cart</a>
                        <form th:action="@{/products/edit/{id}(id=${product.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-secondary">Edit</button>
                        </form>
                        <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Phân trang -->
        <nav aria-label="Page navigation" th:if="${totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${currentPage - 1}, keyword=${keyword}, categoryId=${categoryId}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo; Previous</span>
                    </a>
                </li>
                
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/products(page=${i}, keyword=${keyword}, categoryId=${categoryId}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i}"></a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${currentPage + 1}, keyword=${keyword}, categoryId=${categoryId}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Next">
                        <span aria-hidden="true">Next &raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
